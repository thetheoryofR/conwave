[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-sync-prototype"
version = "0.1.0"
description = "Wang 2003 audio fingerprinting for multi-angle concert sync"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "librosa>=0.10",
    "soundfile>=0.12",
    "matplotlib>=3.7",
]

[project.scripts]
audio-sync = "audio_sync_prototype.cli:main"

[tool.setuptools.packages.find]
where = ["."]
